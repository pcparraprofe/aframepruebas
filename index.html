<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Helado en A-Frame</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
<!-- Cielo -->
<a-sky color="#87CEEB"></a-sky>
<a-box position="-1 1.6 -5" animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true" color="tomato"></a-box>
<!-- Piso naranja -->
<a-plane
position="0 0 -4"
rotation="-90 0 0"
width="30"
height="30"
color="#FF8C00">
</a-plane>

<!- Cámara -->
<a-camera position="0 2 6"></a-camera>
<!-- Helado -->
<!-- Cono -->
<a-cone
position="0 1.2 -4"
radius-bottom="0.6"
radius-top="0.05"
height="1.6"
color="#D2A679">
</a-cone>
 
<!-- Bola principal -->
<a-sphere
position="0 2.3 -4"
radius="0.7"
color="#FFC0CB">
</a-sphere>
 
<!-- Bolas adicionales -->
<a-sphere
position="-0.4 2.1 -4"
radius="0.45"
color="#FF69B4">
</a-sphere>
 
<a-sphere
position="0.4 2.1 -4"
radius="0.45"
color="#FFB6C1">
</a-sphere>
 
<!-- Cereza -->
<a-sphere
position="0 3.05 -4"
radius="0.15"
color="red">
</a-sphere>
 
<!-- Base de la cereza -->
<a-cylinder
position="0 2.9 -4"
radius="0.02"
height="0.25"
color="green">
</a-cylinder>
 <a-assets>
    <a-asset-item id="aero" src="3d/aero.glb"></a-asset-item>
 </a-assets>

 <a-entity gltf-model="#aero" position="1 2.9 -4" scale="0.5 0.5 0.5"></a-entity>
</a-scene>
 
</a-scene>
</body>
</html>
